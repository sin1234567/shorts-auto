name: Daily Shorts Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: sudo add-apt-repository -y multiverse
      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg fonts-noto-cjk open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001

      - run: pip install -r requirements.txt

      - run: python scripts/make_video.py

      - name: Prepare YouTube credentials
        if: ${{ env.YOUTUBE_TOKEN_JSON != '' }}
        shell: bash
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/token.json

      - name: Upload to YouTube
        id: upload
        if: ${{ env.YOUTUBE_TOKEN_JSON != '' }}
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_FILE: secrets/token.json
          YOUTUBE_PRIVACY_STATUS: public
        run: python scripts/upload_youtube.py

      - name: Read upload status
        if: ${{ always() && env.YOUTUBE_TOKEN_JSON != '' }}
        id: upload_status
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("out/upload_status.json")
          status = "missing"
          if path.exists():
              status = json.loads(path.read_text(encoding="utf-8")).get("status", "unknown")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print(f"status={status}", file=f)
          PY

      - name: Summarize upload result
        if: ${{ always() && env.YOUTUBE_TOKEN_JSON != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          status_path = Path("out/upload_status.json")

          if not status_path.exists():
              summary_path.write_text(
                  "## Upload status\n\n`out/upload_status.json` was not created.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          payload = json.loads(status_path.read_text(encoding="utf-8"))
          status = payload.get("status", "unknown")
          reason = payload.get("reason", "")
          source_title = payload.get("source_title", "")
          privacy_status = payload.get("privacyStatus", "")
          publish_at = payload.get("publishAt", "")

          lines = [
              "## Upload status",
              "",
              f"- status: `{status}`",
          ]
          if reason:
              lines.append(f"- reason: `{reason}`")
          if source_title:
              lines.append(f"- source_title: `{source_title}`")
          if privacy_status:
              lines.append(f"- privacyStatus: `{privacy_status}`")
          if publish_at:
              lines.append(f"- publishAt: `{publish_at}`")

          if reason == "tokenRevoked":
              lines.extend(
                  [
                      "",
                      "YouTube token refresh failed.",
                      "Re-run `python scripts/authorize_youtube.py` locally and update the GitHub secret `YOUTUBE_TOKEN_JSON` with the new `secrets/token.json`.",
                  ]
              )

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Fail workflow on upload error
        if: ${{ always() && env.YOUTUBE_TOKEN_JSON != '' && steps.upload.outcome == 'failure' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status_path = Path("out/upload_status.json")
          if not status_path.exists():
              raise SystemExit("Upload failed and out/upload_status.json was not created.")

          payload = json.loads(status_path.read_text(encoding="utf-8"))
          reason = payload.get("reason", "unknown")
          source_title = payload.get("source_title", "")
          raise SystemExit(f"Upload failed: reason={reason} source_title={source_title}")
          PY

      - name: Upload workflow diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts-diagnostics
          if-no-files-found: ignore
          path: |
            out/upload_status.json
            out/metadata.json

      - name: Record posted fact
        if: ${{ success() && env.YOUTUBE_TOKEN_JSON != '' && steps.upload_status.outputs.status == 'uploaded' }}
        run: python scripts/mark_posted.py

      - name: Commit posted history
        if: ${{ success() && env.YOUTUBE_TOKEN_JSON != '' && steps.upload_status.outputs.status == 'uploaded' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_facts.txt
          git commit -m "Record posted fact" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
