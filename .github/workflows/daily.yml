name: Daily Shorts Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: sudo add-apt-repository -y multiverse
      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg fonts-noto-cjk open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001

      - run: pip install -r requirements.txt

      - run: python scripts/make_video.py

      - name: Prepare YouTube credentials
        if: ${{ env.YOUTUBE_TOKEN_JSON != '' }}
        shell: bash
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/token.json

      - name: Upload to YouTube
        if: ${{ env.YOUTUBE_TOKEN_JSON != '' }}
        env:
          YOUTUBE_TOKEN_FILE: secrets/token.json
          YOUTUBE_PRIVACY_STATUS: public
        run: python scripts/upload_youtube.py

      - name: Record posted fact
        if: ${{ success() && env.YOUTUBE_TOKEN_JSON != '' }}
        run: python scripts/mark_posted.py

      - name: Commit posted history
        if: ${{ success() && env.YOUTUBE_TOKEN_JSON != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_facts.txt
          git commit -m "Record posted fact" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
